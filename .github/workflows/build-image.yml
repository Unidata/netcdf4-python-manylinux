name: Build Image from Dockerfile

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: null

permissions: {}

jobs:
  build_image:
    name: Build ${{ matrix.prefix }} image for ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
         - prefix: manylinux
           version: '2_28'
           arch: x86_64
           platforms: linux/amd64
           runs-on: ubuntu-latest
         - prefix: manylinux
           version: '2_28'
           arch: aarch64
           platforms: linux/arm64
           runs-on: ubuntu-24.04-arm
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: lowercase repo-owner
      run: |
        echo "REPO_OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ env.REPO_OWNER_LOWER }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        file: ./Dockerfile_${{ matrix.prefix }}_${{ matrix.version }}_${{ matrix.arch }}
        platforms: ${{ matrix.platforms }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ env.REPO_OWNER_LOWER }}/${{ matrix.prefix }}_${{ matrix.version }}_${{ matrix.arch }}-netcdf
      env:
        BUILDKIT_STEP_LOG_MAX_SIZE: -1 # Unlimited logs
